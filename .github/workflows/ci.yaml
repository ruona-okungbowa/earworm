name: CI

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint-deps:
    name: Package boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:deps

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high

  test:
    name: Test ${{ matrix.project }}
    needs: [lint-deps, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest project names from vitest.config.mts. Add "testing" once that package exists.
        project: [core, browser, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: matrix.project != 'core'
        run: npx playwright install --with-deps chromium
      # --passWithNoTests keeps the job green until each package has tests.
      # Remove it once they do, so a package that loses its tests fails CI.
      - run: >-
          npx vitest run --project ${{ matrix.project }} --passWithNoTests
          --coverage --coverage.reportsDirectory=coverage/${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.project }}
          path: coverage/${{ matrix.project }}
          if-no-files-found: ignore

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint-deps, typecheck, audit, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
